<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>研读 · 登录</title>
  <script>try{var t=localStorage.getItem('yandu-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="stylesheet" href="/static/css/app.css?v=44" />
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/login">
    <p class="kicker">Close Read</p>
    <h1>研读</h1>
    <p class="lede">请输入访问口令。</p>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    <label>口令
      <input type="password" name="password" required autofocus autocomplete="current-password" />
    </label>
    <button type="submit">进入</button>
  </form>
</body>
</html>
